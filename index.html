<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowing Text | HTML and CSS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #01141a;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .text {
            font-size: 6rem;
            font-weight: bold;
            color: #0e3742;
            letter-spacing: 15px;
            -webkit-box-reflect: below 1px linear-gradient(transparent, #0e3742);
            line-height: 0.70em;
            outline: 0;
        }

        @keyframes animate {
            0% {
                color: #0e3742;
                text-shadow: none;
            }

            100% {
                color: #fff;
                text-shadow: 0 0 10px #03bcf4,
                             0 0 20px #03bcf4,
                             0 0 40px #03bcf4,
                             0 0 80px #03bcf4,
                             0 0 160px #03bcf4;
            }
        }
    </style>
</head>
<body>
    <h1 class="text" contenteditable="true">Text</h1>
</body>
</html>
